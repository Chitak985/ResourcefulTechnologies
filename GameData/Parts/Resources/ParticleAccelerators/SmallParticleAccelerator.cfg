PART
{
	name = SmallParticleAccelerator
	module = Part
	author = Chitak 985 YT
	MODEL
	{
		model = ResourcefulTechnologies/GameData/Parts/Resources/ParticleAccelerators/Size3MediumTank
	}	
	rescaleFactor = 1
	node_stack_top = 0.0, 1.931, 0.0, 0.0, 1.0, 0.0, 3
	node_stack_bottom = 0.0, -1.937, 0.0, 0.0, -1.0, 0.0, 3
	node_attach = 0.0, 0.0, -1.89, 0.0, 0.0, 1.0
	TechRequired = specializedElectrics
	entryCost = 55000
	cost = 100000
	category = Utility
	subcategory = 0
	title = DH-1000 Particle Accelerator
	manufacturer = #autoLOC_501638 //#autoLOC_501638 = Kerbodyne
	description = When someone wanted to get a particle accelerator to space, Kerbodyne let them slap it onto their hollowed out signature fuel tank and the DH-1000 was born. This complex torus can accelerate particles to unbelievable speeds and make them collide, producing various cool things, like irradiated snacks.
	attachRules = 1,1,1,1,0
	mass = 15
	dragModelType = default
	maximum_drag = 0.2
	minimum_drag = 0.3
	angularDrag = 2
	crashTolerance = 6
	breakingForce = 300
	breakingTorque = 300
	maxTemp = 2000 // = 2900
	bulkheadProfiles = size3, srf
	tags = #autoLOC_500621 //#autoLOC_500621 = fuel fueltank ?lfo propellant rocket

	MODULE
	{
		name = ModuleSystemHeat
		// Cubic metres
		volume = 15.0
		moduleID = isru
		iconName = Icon_Gears
	}

	MODULE
	{
		name = ModuleResourceConverter
		// must be unique
		moduleID = antimatterProdSmall
		// ModuleSystemHeat moduleID to link to
		systemHeatModuleID = isru
		// The shutdown temperature of the part
		shutdownTemperature = 1300

		// The temperature the system contributes to loops
		systemOutletTemperature = 400

		// Map loop temperature to system efficiency (0-1.0)
		systemEfficiency
		{
			key = 0 0.0
			key = 500 1.0
			key = 700 0.0
		}
		// Heat generation (kW)
		systemPower = 1500

		ConverterName = Antimatter
		StartActionName = Start Particle Accelerator [Antimatter]
		StopActionName = Stop Particle Accelerator [Antimatter]
		ToggleActionName = Toggle Particle Accelerator [Antimatter]
		AutoShutdown = true
		GeneratesHeat = false
		DefaultShutoffTemp = .8
		UseSpecialistBonus = true
		SpecialistEfficiencyFactor = 0.2
		SpecialistBonusBase = 0.05
		ExperienceEffect = ConverterSkill
		EfficiencyBonus = 1
		INPUT_RESOURCE
		{
			ResourceName = LqdHydrogen
			Ratio = 0.001
			FlowMode = STAGE_PRIORITY_FLOW
		}
		INPUT_RESOURCE
		{
			ResourceName = ElectricCharge
			Ratio = 2000
		}
		OUTPUT_RESOURCE
		{
			ResourceName = Antimatter
			Ratio = 0.001
			DumpExcess = false
			FlowMode = STAGE_PRIORITY_FLOW
		}
	}

	MODULE
	{
		name = ModuleResourceConverter
		// must be unique
		moduleID = lithium6ProdSmall
		// ModuleSystemHeat moduleID to link to
		systemHeatModuleID = isru
		// The shutdown temperature of the part
		shutdownTemperature = 1300

		// The temperature the system contributes to loops
		systemOutletTemperature = 400

		// Map loop temperature to system efficiency (0-1.0)
		systemEfficiency
		{
			key = 0 0.0
			key = 500 1.0
			key = 700 0.0
		}
		// Heat generation (kW)
		systemPower = 1000

		ConverterName = Lithium-6
		StartActionName = Start Particle Accelerator [Lithium-6]
		StopActionName = Stop Particle Accelerator [Lithium-6]
		ToggleActionName = Toggle Particle Accelerator [Lithium-6]
		AutoShutdown = true
		GeneratesHeat = false
		DefaultShutoffTemp = .8
		UseSpecialistBonus = true
		SpecialistEfficiencyFactor = 0.2
		SpecialistBonusBase = 0.05
		ExperienceEffect = ConverterSkill
		EfficiencyBonus = 1
		INPUT_RESOURCE
		{
			ResourceName = Lithium
			Ratio = 1
			FlowMode = STAGE_PRIORITY_FLOW
		}
		INPUT_RESOURCE
		{
			ResourceName = ElectricCharge
			Ratio = 1000
		}
		OUTPUT_RESOURCE
		{
			ResourceName = Lithium6
			Ratio = 0.01
			DumpExcess = false
			FlowMode = STAGE_PRIORITY_FLOW
		}
	}

	MODULE
	{
		name = ModuleResourceConverter
		// must be unique
		moduleID = helium3ProdSmall
		// ModuleSystemHeat moduleID to link to
		systemHeatModuleID = isru
		// The shutdown temperature of the part
		shutdownTemperature = 1300

		// The temperature the system contributes to loops
		systemOutletTemperature = 400

		// Map loop temperature to system efficiency (0-1.0)
		systemEfficiency
		{
			key = 0 0.0
			key = 500 1.0
			key = 700 0.0
		}
		// Heat generation (kW)
		systemPower = 800

		ConverterName = Helium-3
		StartActionName = Start Particle Accelerator [Helium-3]
		StopActionName = Stop Particle Accelerator [Helium-3]
		ToggleActionName = Toggle Particle Accelerator [Helium-3]
		AutoShutdown = true
		GeneratesHeat = false
		DefaultShutoffTemp = .8
		UseSpecialistBonus = true
		SpecialistEfficiencyFactor = 0.2
		SpecialistBonusBase = 0.05
		ExperienceEffect = ConverterSkill
		EfficiencyBonus = 1
		INPUT_RESOURCE
		{
			ResourceName = Lithium6
			Ratio = 0.1
			FlowMode = STAGE_PRIORITY_FLOW
		}
		INPUT_RESOURCE
		{
			ResourceName = ElectricCharge
			Ratio = 1000
		}
		OUTPUT_RESOURCE
		{
			ResourceName = Helium3
			Ratio = 0.01
			DumpExcess = false
			FlowMode = STAGE_PRIORITY_FLOW
		}
	}

	$MODULE:HAS[#moduleID[helium3ProdSmall]]:FIRST
	{
		@ConverterName = Liquid Helium-3
		@StartActionName = Start Particle Accelerator [Liquid Helium-3]
		@StopActionName = Stop Particle Accelerator [Liquid Helium-3]
		@ToggleActionName = Toggle Particle Accelerator [Liquid Helium-3]
		@OUTPUT_RESOURCE
		{
			@ResourceName = LqdHe3
		}
	}

	MODULE
	{
		name = ModulePartVariants
		baseVariant = BlackAndWhite
		useMultipleDragCubes = false
		VARIANT
		{
			name = BlackAndWhite
			displayName = #autoLOC_8007122
			themeName = White
			primaryColor = #ffffff
			secondaryColor = #000000
			TEXTURE
			{
				mainTextureURL = ResourcefulTechnologies/GameData/Parts/Resources/ParticleAccelerators/Size3Tanks
				_BumpMap = ResourcefulTechnologies/GameData/Parts/Resources/ParticleAccelerators/Size3Tanks_Norm
			}
		}
		VARIANT
		{
			name = Orange
			displayName = #autoLOC_8007123
			themeName = Orange
			primaryColor = #f49841
			secondaryColor = #4c4f47
			TEXTURE
			{
				mainTextureURL = ResourcefulTechnologies/GameData/Parts/Resources/ParticleAccelerators/Size3Tanks_Orange
				_BumpMap = ResourcefulTechnologies/GameData/Parts/Resources/ParticleAccelerators/Size3Tanks_Orange_Norm
			}
		}
	}		
}
